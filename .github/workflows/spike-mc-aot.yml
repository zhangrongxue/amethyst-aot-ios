name: Spike MC AOT

# Feasibility spike for the JIT-free path: AOT-compile the real Minecraft client
# closure with MobiVM/RoboVM and capture exactly where it breaks.
on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: Minecraft version to probe (Java 8 era, e.g. 1.12.2 / 1.8.9)
        required: false
        default: '1.12.2'
      max_time:
        description: Soft time budget marker only (minutes)
        required: false
        default: '60'

jobs:
  spike:
    name: MC closure AOT (${{ github.event.inputs.mc_version || '1.12.2' }})
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch Minecraft jars
        env:
          MC_VERSION: ${{ github.event.inputs.mc_version || '1.12.2' }}
        run: |
          python3 scripts/fetch_minecraft.py --version "$MC_VERSION" --out work/mc --os osx --arch arm64
          ls work/mc | head; du -sh work/mc

      - name: Download MobiVM dist
        run: |
          mkdir -p work/robovm
          curl -fSL --retry 3 -o work/robovm-dist.tar.gz \
            https://repo1.maven.org/maven2/com/mobidevelop/robovm/robovm-dist/2.3.23/robovm-dist-2.3.23.tar.gz
          tar xzf work/robovm-dist.tar.gz -C work/robovm --strip-components=1
          ls work/robovm
          ls work/robovm/lib | head

      - name: Compile spike entry class
        run: |
          mkdir -p work/spike-classes
          javac --release 8 -encoding UTF-8 \
            -cp work/mc/client.jar \
            -d work/spike-classes \
            spikes/mc-aot/src/dev/mcjava/spike/McMain.java
          ls work/spike-classes/dev/mcjava/spike

      - name: Build Java 8 API extras (streams/function missing from RoboVM rt)
        run: |
          # JDK 8 has no macOS arm64 build; we only need rt.jar (class files are
          # architecture independent), so the mac/x64 tarball is fine.
          curl -fSL --retry 3 -o work/jdk8.tar.gz \
            'https://api.adoptium.net/v3/binary/latest/8/ga/mac/x64/jdk/hotspot/normal/eclipse'
          mkdir -p work/jdk8
          tar xzf work/jdk8.tar.gz -C work/jdk8
          RT=$(find work/jdk8 -name rt.jar | head -1)
          echo "rt.jar: $RT"
          mkdir -p work/extras
          cd work/extras
          unzip -q "$OLDPWD/$RT" 'java/util/function/*' 'java/util/stream/*' 'java/util/Spliterator*' 'java/util/Optional*' 2>/dev/null || true
          cd "$OLDPWD"
          jar cf work/java8-extras.jar -C work/extras .
          ls -la work/java8-extras.jar
          unzip -l work/java8-extras.jar | tail -3

      - name: AOT compile MC closure (expected to fail; we mine the errors)
        run: |
          set +e
          # Amethyst runs 1.8.9+ through LWJGL3 + the lwjglx compatibility layer,
          # so the vanilla LWJGL 2.x jars must be replaced by the launcher's own set.
          CP="work/spike-classes:$(ls work/mc/*.jar work/mc/libs/*.jar 2>/dev/null | grep -v '/lwjgl' | tr '\n' ':')$(ls JavaApp/libs/lwjgl/*.jar | tr '\n' ':')"
          # Append the Java 8 extras to the boot classpath: RoboVM rt wins for the
          # classes it has, the extras fill java.util.function / java.util.stream.
          BCP="work/robovm/lib/robovm-rt.jar:work/java8-extras.jar"
          export JAVA_HOME="$JAVA_HOME"
          # RoboVM's -o is the *binary name*, not a path: output goes to -d <dir>.
          OUTDIR="$PWD/work/spike-out"
          mkdir -p "$OUTDIR"
          work/robovm/bin/robovm \
            -config spikes/mc-aot/robovm.xml \
            -cp "$CP" \
            -bcp "$BCP" \
            -o mc-aot-spike \
            -d "$OUTDIR" \
            -os macosx -arch arm64 -target console \
            -verbose \
            dev.mcjava.spike.McMain 2>&1 | tee work/spike.log
          echo "robovm exit=${PIPESTATUS[0]}"
          ls -la "$OUTDIR" || true

      - name: Run the AOT binary (headless probe)
        if: always()
        run: |
          BIN="$PWD/work/spike-out/mc-aot-spike"
          if [ ! -x "$BIN" ]; then
            echo "no AOT binary produced"
            ls -la work/spike-out 2>/dev/null || true
            exit 0
          fi
          mkdir -p work/game work/assets
          set +e
          # macOS has no `timeout`; use perl's alarm as a portable watchdog.
          perl -e 'alarm shift; exec @ARGV' 120 "$BIN" \
            --gameDir "$PWD/work/game" \
            --assetsDir "$PWD/work/assets" \
            --assetIndex 1.8 \
            --uuid 0 --accessToken 0 --username dev --version 1.8.9 \
            2>&1 | tee work/spike-run.log
          echo "run exit=${PIPESTATUS[0]}"
          echo "=== first failure ==="
          grep -nE 'Exception|Error|at (net|org|com)\.|Caused by' work/spike-run.log | head -40 || true

      - name: Summarise failure classes
        if: always()
        run: |
          echo "=== compiled class count ==="
          grep -c '^Compiling ' work/spike.log || true
          echo "=== undefined symbols (JNI surface) ==="
          grep -nE 'Undefined symbols|referenced from|ld: symbol' work/spike.log | head -80 || true
          echo "=== phantom classes (missing Java 8 APIs in RoboVM rt) ==="
          grep -o 'Warning: [^ ]* is a phantom class!' work/spike.log | sed 's/Warning: //; s/ is a phantom class!//' | sort -u | tee work/phantom-classes.txt | head -60 || true
          echo "=== other errors ==="
          grep -nE 'error:|Error|Unsupported|Caused by' work/spike.log | head -60 || true
          echo "=== log size: $(wc -l < work/spike.log) lines ==="

      - name: Upload spike log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-mc-aot-log
          path: |
            work/spike.log
            work/spike-run.log
            work/phantom-classes.txt
            work/spike-out/mc-aot-spike
          if-no-files-found: warn
