name: Spike MC AOT

# Feasibility spike for the JIT-free path: AOT-compile the real Minecraft client
# closure with MobiVM/RoboVM and capture exactly where it breaks.
on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: Minecraft version to probe (Java 8 era, e.g. 1.12.2 / 1.8.9)
        required: false
        default: '1.12.2'
      max_time:
        description: Soft time budget marker only (minutes)
        required: false
        default: '60'
      ios_link:
        description: Also build the iOS-target AOT app linking Amethyst dylibs
        type: boolean
        required: false
        default: true

jobs:
  spike:
    name: MC closure AOT (${{ github.event.inputs.mc_version || '1.12.2' }})
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch Minecraft jars
        env:
          MC_VERSION: ${{ github.event.inputs.mc_version || '1.12.2' }}
        run: |
          python3 scripts/fetch_minecraft.py --version "$MC_VERSION" --out work/mc --os osx --arch arm64
          ls work/mc | head; du -sh work/mc

      - name: Download MobiVM dist
        run: |
          mkdir -p work/robovm
          curl -fSL --retry 3 -o work/robovm-dist.tar.gz \
            https://repo1.maven.org/maven2/com/mobidevelop/robovm/robovm-dist/2.3.23/robovm-dist-2.3.23.tar.gz
          tar xzf work/robovm-dist.tar.gz -C work/robovm --strip-components=1
          ls work/robovm
          ls work/robovm/lib | head

      - name: Build Java 8 API extras (streams/function missing from RoboVM rt)
        run: |
          # JDK 8 has no macOS arm64 build; we only need rt.jar (class files are
          # architecture independent), so the mac/x64 tarball is fine.
          curl -fSL --retry 3 -o work/jdk8.tar.gz \
            'https://api.adoptium.net/v3/binary/latest/8/ga/mac/x64/jdk/hotspot/normal/eclipse'
          mkdir -p work/jdk8
          tar xzf work/jdk8.tar.gz -C work/jdk8
          RT=$(find work/jdk8 -name rt.jar | head -1)
          echo "rt.jar: $RT"
          mkdir -p work/extras
          cd work/extras
          unzip -q "$OLDPWD/$RT" 'java/util/function/*' 'java/util/stream/*' 'java/util/Spliterator*' 'java/util/Optional*' 2>/dev/null || true
          cd "$OLDPWD"
          jar cf work/java8-extras.jar -C work/extras .
          ls -la work/java8-extras.jar
          unzip -l work/java8-extras.jar | tail -3

      - name: Compile spike payload (entry + Java 8 compat helpers)
        run: |
          mkdir -p work/spike-classes
          javac --release 8 -encoding UTF-8 \
            -cp "work/mc/client.jar:work/java8-extras.jar" \
            -d work/spike-classes \
            $(find spikes/mc-aot/src -name '*.java')
          find work/spike-classes -name '*.class' | head

      - name: Build Amethyst JavaApp (real runtime classpath)
        run: |
          brew install --cask temurin@8
          export BOOTJDK="$(/usr/libexec/java_home -v 1.8)/bin"
          echo "BOOTJDK=$BOOTJDK"
          "$BOOTJDK/javac" -version
          make -C JavaApp -j"$(sysctl -n hw.ncpu)" BOOTJDK="$BOOTJDK"
          ls -la JavaApp/build

      - name: Build AOT patcher and neutralise LWJGL dynamic loading
        run: |
          curl -fSL --retry 3 -o work/asm.jar https://repo1.maven.org/maven2/org/ow2/asm/asm/9.7/asm-9.7.jar
          curl -fSL --retry 3 -o work/asm-tree.jar https://repo1.maven.org/maven2/org/ow2/asm/asm-tree/9.7/asm-tree-9.7.jar
          mkdir -p work/patch-classes
          javac --release 8 -encoding UTF-8 -cp work/asm.jar:work/asm-tree.jar \
            -d work/patch-classes tools/aot-patch/src/dev/mcjava/patch/AotPatch.java
          LWJGL_JAR=JavaApp/build/lwjgl.jar
          [ -f "$LWJGL_JAR" ] || LWJGL_JAR=JavaApp/libs/lwjgl/lwjgl.jar
          echo "patching $LWJGL_JAR"
          java -cp work/patch-classes:work/asm.jar:work/asm-tree.jar \
            dev.mcjava.patch.AotPatch \
            "$LWJGL_JAR" work/lwjgl-patched.jar \
            org.lwjgl.system.Library loadSystem
          # Backport Java 8 APIs that RoboVM's runtime lacks (ThreadLocal.withInitial, ...)
          javac --release 8 -encoding UTF-8 -cp work/asm.jar:work/asm-tree.jar \
            -d work/patch-classes tools/aot-patch/src/dev/mcjava/patch/Java8Shim.java
          java -cp work/patch-classes:work/asm.jar:work/asm-tree.jar \
            dev.mcjava.patch.Java8Shim work/lwjgl-patched.jar work/lwjgl-shim.jar
          unzip -p work/lwjgl-shim.jar org/lwjgl/system/MemoryUtil.class | wc -c

      - name: AOT compile MC closure (expected to fail; we mine the errors)
        run: |
          set +e
          # Amethyst's runtime classpath: the built JavaApp jars (launcher.jar has
          # the custom android/util + net.kdt classes, build/lwjgl.jar has the custom
          # GLFW/Sys) plus the vanilla MC libraries minus log4j-core.
          APP_JARS="$(ls JavaApp/build/*.jar 2>/dev/null | grep -v '/lwjgl\.jar$' | tr '\n' ':')$(ls JavaApp/libs/others/*.jar 2>/dev/null | tr '\n' ':')"
          CP="work/spike-classes:work/lwjgl-shim.jar:$APP_JARS$(ls work/mc/*.jar work/mc/libs/*.jar 2>/dev/null | grep -v '/lwjgl' | grep -v 'log4j-core' | tr '\n' ':')"
          # Append the Java 8 extras to the boot classpath: RoboVM rt wins for the
          # classes it has, the extras fill java.util.function / java.util.stream.
          BCP="work/robovm/lib/robovm-rt.jar:work/java8-extras.jar"
          echo "SPIKE_CP=$CP" >> "$GITHUB_ENV"
          echo "SPIKE_BCP=$BCP" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME"
          # RoboVM's -o is the *binary name*, not a path: output goes to -d <dir>.
          OUTDIR="$PWD/work/spike-out"
          mkdir -p "$OUTDIR"
          work/robovm/bin/robovm \
            -config spikes/mc-aot/robovm.xml \
            -cp "$CP" \
            -bcp "$BCP" \
            -o mc-aot-spike \
            -d "$OUTDIR" \
            -os macosx -arch arm64 -target console \
            -verbose \
            dev.mcjava.spike.McMain 2>&1 | tee work/spike.log
          echo "robovm exit=${PIPESTATUS[0]}"
          ls -la "$OUTDIR" || true

      - name: AOT build for iOS + fix dylib names + package unsigned IPA
        if: ${{ github.event.inputs.ios_link != 'false' }}
        run: |
          set +e
          IOS_OUT="$PWD/work/ios-out"
          rm -rf "$IOS_OUT"
          mkdir -p "$IOS_OUT"
          FW="$PWD/Natives/resources/Frameworks"
          echo "iphoneos sdk: $(xcrun --sdk iphoneos --show-sdk-version)"
          work/robovm/bin/robovm \
            -config spikes/mc-aot/robovm.xml \
            -cp "$SPIKE_CP" \
            -bcp "$SPIKE_BCP" \
            -libs "$FW/liblwjgl.dylib:$FW/liblwjgl_opengl.dylib" \
            -o mc-aot-ios \
            -d "$IOS_OUT" \
            -os ios -arch arm64 -target ios -skipsign \
            -verbose \
            dev.mcjava.spike.McMain 2>&1 | tee work/ios-link.log
          echo "robovm ios exit=${PIPESTATUS[0]}"
          ls -la "$IOS_OUT" | head -20

          BIN="$IOS_OUT/mc-aot-ios"
          if [ ! -x "$BIN" ]; then echo "no iOS binary produced"; exit 0; fi
          file "$BIN"
          echo "=== LC_LOAD_DYLIB before fix ==="
          otool -L "$BIN" | head -20

          mkdir -p "$IOS_OUT/Frameworks"
          for lib in liblwjgl.dylib liblwjgl_opengl.dylib; do
            [ -f "$FW/$lib" ] && cp "$FW/$lib" "$IOS_OUT/Frameworks/$lib"
          done

          # Rewrite every build-time path dependency to @rpath/<basename>.
          fix_deps() {
            local f="$1"
            otool -L "$f" | tail -n +2 | awk '{print $1}' | while read -r dep; do
              case "$dep" in
                bin/libs/native/macos/*)
                  base=$(basename "$dep")
                  echo "  $f: $dep -> @rpath/$base"
                  install_name_tool -change "$dep" "@rpath/$base" "$f"
                  ;;
              esac
            done
          }
          fix_deps "$BIN"
          for lib in "$IOS_OUT"/Frameworks/*.dylib; do
            [ -f "$lib" ] || continue
            install_name_tool -id "@rpath/$(basename "$lib")" "$lib"
            fix_deps "$lib"
          done
          echo "=== LC_LOAD_DYLIB after fix ==="
          otool -L "$BIN" | head -20
          for lib in "$IOS_OUT"/Frameworks/*.dylib; do
            [ -f "$lib" ] && otool -L "$lib" | head -10
          done

          # install_name_tool invalidates signatures; re-sign ad-hoc.
          for lib in "$IOS_OUT"/Frameworks/*.dylib; do
            [ -f "$lib" ] && codesign -f -s - "$lib" 2>/dev/null
          done
          codesign -f -s - "$BIN" 2>/dev/null || true

          echo "=== packaging unsigned IPA ==="
          PKG="$PWD/work/ios-pkg"
          IPA="$PWD/work/amethyst-aot-unsigned.ipa"
          rm -rf "$PKG" "$IPA"
          mkdir -p "$PKG/Payload"
          cp -R "$IOS_OUT" "$PKG/Payload/AmethystAOT.app"
          ( cd "$PKG" && zip -ry "$IPA" Payload > /dev/null )
          ls -la "$IPA"
          unzip -l "$IPA" | head -20

      - name: Run the AOT binary (headless probe)
        if: always()
        run: |
          BIN="$PWD/work/spike-out/mc-aot-spike"
          if [ ! -x "$BIN" ]; then
            echo "no AOT binary produced"
            ls -la work/spike-out 2>/dev/null || true
            exit 0
          fi
          mkdir -p work/game work/assets
          set +e
          # macOS has no `timeout`; use perl's alarm as a portable watchdog.
          perl -e 'alarm shift; exec @ARGV' 120 "$BIN" \
            --gameDir "$PWD/work/game" \
            --assetsDir "$PWD/work/assets" \
            --assetIndex 1.8 \
            --uuid 0 --accessToken 0 --username dev --version 1.8.9 \
            2>&1 | tee work/spike-run.log
          echo "run exit=${PIPESTATUS[0]}"
          echo "=== first failure ==="
          grep -nE 'Exception|Error|at (net|org|com)\.|Caused by' work/spike-run.log | head -40 || true

      - name: Summarise failure classes
        if: always()
        run: |
          echo "=== compiled class count ==="
          grep -c '^Compiling ' work/spike.log || true
          echo "=== undefined symbols (JNI surface) ==="
          grep -nE 'Undefined symbols|referenced from|ld: symbol' work/spike.log | head -80 || true
          echo "=== phantom classes (missing Java 8 APIs in RoboVM rt) ==="
          grep -o 'Warning: [^ ]* is a phantom class!' work/spike.log | sed 's/Warning: //; s/ is a phantom class!//' | sort -u | tee work/phantom-classes.txt | head -60 || true
          echo "=== other errors ==="
          grep -nE 'error:|Error|Unsupported|Caused by' work/spike.log | head -60 || true
          echo "=== log size: $(wc -l < work/spike.log) lines ==="

      - name: Upload spike log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-mc-aot-log
          path: |
            work/spike.log
            work/spike-run.log
            work/ios-link.log
            work/amethyst-aot-unsigned.ipa
            work/phantom-classes.txt
            work/spike-out/mc-aot-spike
            work/ios-out
          if-no-files-found: warn
